<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Admin Panel</h1>

    <h2>Add Business</h2>
    <form id="addBusinessForm">
        <label for="category_id">Category ID:</label><br>
        <input type="number" id="category_id" name="category_id"><br><br>

        <label for="name">Business Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="description">Description:</label><br>
        <textarea id="description" name="description"></textarea><br><br>

        <label for="contact_phone">Contact Phone:</label><br>
        <input type="text" id="contact_phone" name="contact_phone"><br><br>

        <label for="address">Address:</label><br>
        <input type="text" id="address" name="address"><br><br>

        <label for="website">Website:</label><br>
        <input type="text" id="website" name="website"><br><br>

        <button type="button" onclick="addBusiness()">Add Business</button>
    </form>

    <h2>View Businesses</h2>
    <button type="button" onclick="getBusinesses()">View Businesses</button>
    <div id="businessesTable"></div>

    <h2>Get Business by ID</h2>
<form id="getBusinessForm">
    <label for="business_id">Business ID:</label><br>
    <input type="number" id="business_id" name="business_id"><br><br>
    <button type="button" onclick="getBusiness()">Get Business</button>
</form>
<div id="businessDetails"></div>

    <script src="admin.js"></script>
</body>
</html>
